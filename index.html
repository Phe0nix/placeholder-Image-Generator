<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Placeholder Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>
    <main class="app-shell">
        <header class="app-header">
            <p class="eyebrow">Designer Utility</p>
            <h1>Placeholder Image Generator</h1>
            <p class="subtitle">Build custom placeholders in seconds with presets, smart validation, and export controls.</p>
            <a href="https://github.com/Phe0nix/placeholder-Image-Generator" id="view-on-github" class="github-link" target="_blank" rel="noopener noreferrer">View on GitHub</a>
        </header>

        <section class="app-grid">
            <form class="panel controls" id="placeholderForm" novalidate>
                <h2>Canvas Settings</h2>
                <section class="preset-section" id="presetSection" aria-labelledby="presetSectionTitle">
                    <div class="section-heading">
                        <h3 id="presetSectionTitle">Image Presets</h3>
                        <button type="button" class="text-action" id="togglePresets" aria-expanded="false" aria-controls="presetGrid">View more presets</button>
                    </div>
                    <div class="preset-grid" id="presetGrid">
                        <button type="button" class="preset-card" data-preset="og-image">
                            <strong>Open Graph</strong>
                            <span>1200 x 630 • WEBP</span>
                        </button>
                        <button type="button" class="preset-card" data-preset="avatar-128">
                            <strong>Avatar</strong>
                            <span>128 x 128 • PNG</span>
                        </button>
                        <button type="button" class="preset-card" data-preset="card-thumb">
                            <strong>Card Thumbnail</strong>
                            <span>800 x 450 • JPG</span>
                        </button>
                        <button type="button" class="preset-card" data-preset="hero-banner">
                            <strong>Hero Banner</strong>
                            <span>1440 x 720 • PNG</span>
                        </button>
                        <button type="button" class="preset-card" data-preset="mobile-screen">
                            <strong>Mobile Screen</strong>
                            <span>390 x 844 • PNG</span>
                        </button>
                        <button type="button" class="preset-card" data-preset="video-thumb">
                            <strong>Video Thumbnail</strong>
                            <span>1280 x 720 • WEBP</span>
                        </button>
                    </div>
                </section>
                <div class="field-row two-col">
                    <label for="widthInput">Width (px)
                        <input type="number" id="widthInput" class="width" min="1" max="4000" step="1" placeholder="1200" required>
                    </label>
                    <label for="heightInput">Height (px)
                        <input type="number" id="heightInput" class="height" min="1" max="4000" step="1" placeholder="628" required>
                    </label>
                </div>
                <div class="quick-actions">
                    <button type="button" class="chip" data-size="1080x1080">1080 x 1080</button>
                    <button type="button" class="chip" data-size="1200x628">1200 x 628</button>
                    <button type="button" class="chip" data-size="1920x1080">1920 x 1080</button>
                </div>
                <div class="inline-controls">
                    <label class="toggle">
                        <input type="checkbox" id="lockAspect" checked>
                        <span>Lock aspect ratio</span>
                    </label>
                    <button type="button" class="text-action" id="swapDimensions">Swap dimensions</button>
                </div>

                <div class="field-row two-col">
                    <label for="bgColor">Background
                        <input type="color" id="bgColor" class="bgColor" value="#2f80ed">
                    </label>
                    <label for="textColor">Text Color
                        <input type="color" id="textColor" class="textColor" value="#ffffff">
                    </label>
                </div>

                <label for="labelText">Label Text
                    <input type="text" id="labelText" class="labelText" placeholder="Leave empty to use dimensions">
                </label>

                <label for="fileName">File Name
                    <input type="text" id="fileName" class="fileName" value="placeholder-image" maxlength="80">
                </label>

                <div class="field-row two-col">
                    <label for="imageType">Format
                        <select name="imageType" id="imageType">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPG</option>
                            <option value="webp">WEBP</option>
                        </select>
                    </label>
                    <label for="quality_value" class="quality" id="qualityWrap">Quality
                        <input type="range" id="quality_value" min="10" max="100" value="85" step="5">
                        <output id="qualityOutput" for="quality_value">85%</output>
                    </label>
                </div>

                <div class="cta-row">
                    <button type="submit" class="gen">Generate Image</button>
                    <button type="button" class="secondary" id="randomPalette">Random Palette</button>
                </div>
            </form>

            <section class="panel preview-panel">
                <div class="preview-header">
                    <h2>Preview</h2>
                    <p id="metaInfo" class="meta">No image generated yet</p>
                </div>

                <div class="result" id="result" role="status" aria-live="polite">
                    <canvas class="block" id="previewCanvas" width="1200" height="628"></canvas>
                </div>

                <p id="errorMessage" class="error" role="alert" aria-live="assertive"></p>

                <div class="type_and_download_image" id="downloadArea">
                    <button type="button" class="download" id="downloadBtn">Download Image</button>
                    <button type="button" class="secondary" id="copyDataUrl">Copy Data URL</button>
                    <button type="button" class="secondary" id="copyShareUrl">Copy Share URL</button>
                </div>
            </section>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
